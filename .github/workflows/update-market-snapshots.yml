name: Update Market Snapshots

on:
  schedule:
    - cron: "0 16 15 * *"
  workflow_dispatch:

env:
  MARKET_STATS_BASE_URL: ${{ vars.MARKET_STATS_BASE_URL }}
  MARKET_STATS_API_KEY: ${{ secrets.MARKET_STATS_API_KEY }}

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found; skipping npm install."
          fi

      - name: Preflight market API debug (safe)
        run: |
          echo "MARKET_STATS_BASE_URL present: $([ -n "${MARKET_STATS_BASE_URL:-}" ] && echo yes || echo no)"
          echo "MARKET_STATS_API_KEY present: $([ -n "${MARKET_STATS_API_KEY:-}" ] && echo yes || echo no)"
          node -e '''
            const base = process.env.MARKET_STATS_BASE_URL || "https://orion-market-stats.orion-love-co.workers.dev";
            const endpoint = new URL("/api/market-stats", base).toString();
            const key = process.env.MARKET_STATS_API_KEY;
            const methods = [
              ["bearer", key ? { Accept: "application/json", Authorization: `Bearer ${key}` } : { Accept: "application/json" }],
              ["x-api-key", key ? { Accept: "application/json", "x-api-key": key } : { Accept: "application/json" }],
              ["none", { Accept: "application/json" }],
            ];

            async function run() {
              for (const [name, headers] of methods) {
                try {
                  const res = await fetch(endpoint, { headers });
                  console.log(`[probe:${name}] status=${res.status}`);
                  let data = null;
                  try { data = await res.json(); } catch {}
                  if (data && typeof data === "object") {
                    console.log(`[probe:${name}] top-level keys=${Object.keys(data).join(",") || "(none)"}`);
                    const areaKeys = data?.areas && typeof data.areas === "object" ? Object.keys(data.areas) : [];
                    console.log(`[probe:${name}] area keys=${areaKeys.join(",") || "(none)"}`);
                  }
                } catch (err) {
                  console.log(`[probe:${name}] fetch error=${err.message}`);
                }
              }
            }
            run();
          '''

      - name: Update market snapshots
        run: node scripts/update-market-snapshots.mjs

      - name: Validate site (if validate_site.py exists)
        run: |
          if [ -f validate_site.py ]; then
            python validate_site.py
          else
            echo "No validate_site.py found; skipping validation."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sell-*.html market-data/*.json scripts/update-market-snapshots.mjs .github/workflows/update-market-snapshots.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh market snapshots"
          git push

      - name: Trigger Cloudflare deploy hook (optional)
        if: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
